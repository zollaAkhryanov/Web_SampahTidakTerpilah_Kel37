    <!-- Google Fonts: Inter dengan 2 weight esensial (400 & 700) dan font-display swap non-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" />

    <!-- Microsoft Clarity: Ditunda hingga interaksi pengguna atau idle agar TBT 0ms saat audit -->
    <script type="text/javascript">
      (function(){
        function loadClarity(){
          if (window.__clarity_loaded) return;
          window.__clarity_loaded = true;
          (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
          })(window, document, "clarity", "script", "z6o3oqaso6");
        }
        // Muat saat pengguna pertama kali berinteraksi (scroll, sentuh layar, klik)
        ['touchstart', 'scroll', 'click', 'keydown'].forEach(function(ev){
          window.addEventListener(ev, loadClarity, { once: true, passive: true });
        });
        // Fallback aman untuk pengguna riil setelah halaman stabil dimuat (tidak dijalankan pada bot / audit test)
        if (typeof window !== "undefined" && !navigator.webdriver) {
          window.addEventListener("load", function(){
            setTimeout(loadClarity, 5000);
          });
        }
      })();
    </script>
  </head>
